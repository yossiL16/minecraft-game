<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>minecraft game basic</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<div id="container"></div>
<div id="footer">

    <div class="text-start"><div class="contai-text"><p>Stary playing to have items!</p></div></div>

    <div class="icons">
        <div class="box"><img class="icon-box" src="image/box.png" alt="box icon"></div>
        <div class="ax bg-icon"><img class="icon" src="image/ax.ico" alt="ax icone"></div>
        <div class="shovel bg-icon"><img class="icon" src="image/shovel.ico" alt="shovel icon"></div>
        <div class="mining bg-icon"><img class="icon" src="image/pickaxe.ico" alt="pickaxe icon"></div>
        <div class="sword bg-icon"><img class="icon" src="image/sword.ico" alt="sword icon"></div>
    </div>

        <div class="reset-game">
            <div class="div-reset">
                <p class="reset-text">reset game</p>
            </div>
        </div>
    </div>
    

</body>
</html>
